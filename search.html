---
layout: default
title: 站内搜索
description: 搜索技术文章、项目介绍与个人工程经历。
permalink: /search/
---
<div class="narrow-page">
  <p class="eyebrow">SEARCH</p>
  <h1>站内搜索</h1>
  <p>搜索文章全文、项目与个人经历。也可以<a class="text-link" href="{{ '/archive/' | relative_url }}">按类型与主题筛选文章 →</a></p>
  <label for="site-search">你想了解什么？</label>
  <input class="big-search" id="site-search" type="search" placeholder="如：RAG、失败恢复、科研、实习" autofocus aria-describedby="search-status">
  <p class="muted" id="search-status" role="status" aria-live="polite"></p>
  <noscript><p>搜索需要启用 JavaScript；可以直接浏览<a href="{{ '/archive/' | relative_url }}">全部文章</a>和<a href="{{ '/projects/' | relative_url }}">项目页</a>。</p></noscript>
  <div id="search-results" class="search-results"></div>
</div>
<script>
window.SEARCH_INDEX = [
{% for post in site.posts %}{"title":{{ post.title | jsonify }},"url":{{ post.url | relative_url | jsonify }},"excerpt":{{ post.description | default: post.subtitle | default: post.excerpt | strip_html | strip_newlines | jsonify }},"content":{{ post.content | strip_html | strip_newlines | jsonify }},"tags":{{ post.tags | join:' ' | jsonify }},"kind":{{ post.content_kind | default: '工程方法' | jsonify }} },{% endfor %}
{% assign searchable_pages = site.pages | where_exp: 'p', 'p.title' %}{% for item in searchable_pages %}{% if item.url != page.url and item.redirect_to == nil %}{"title":{{ item.title | jsonify }},"url":{{ item.url | relative_url | jsonify }},"excerpt":{{ item.description | default: item.title | jsonify }},"content":{{ item.content | strip_html | strip_newlines | jsonify }},"tags":"","kind":"站内页面"},{% endif %}{% endfor %}
];
</script>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
