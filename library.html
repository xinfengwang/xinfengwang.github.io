<div class="narrow-page reader-library">
  <p class="eyebrow">YOUR READING SPACE</p>
  <h1>我的书架</h1>
  <p class="lead">把有用的文章留下，把没读完的接着读。</p>
  <p>收藏、阅读位置与已读标记保存在当前浏览器，不会上传，也不会跨设备同步。清除浏览器数据会删除这些记录；你可以导出一份 Markdown 阅读清单。</p>
  <div class="library-filters" role="group" aria-label="书架筛选">
    <button type="button" data-library-filter="saved" aria-pressed="true">我的收藏</button>
    <button type="button" data-library-filter="recent" aria-pressed="false">最近阅读</button>
    <button type="button" data-library-filter="read" aria-pressed="false">已经读完</button>
    <button type="button" data-library-filter="excerpts" aria-pressed="false">摘录与笔记</button>
    <button type="button" id="library-export">导出阅读清单 ↓</button>
  </div>
  <p id="library-status" role="status" aria-live="polite"></p>
  <div id="library-items"></div>
  <div id="excerpt-items" hidden></div>
