foundations: |
  flowchart TB
    A["语言模型输出候选"] --> B["运行时校验并决定执行"]
    B --> C["工具观察环境"]
    C --> D["反馈更新任务状态"]
    D -->|仍可推进| A
    D -->|通过验收或需要澄清| E["产生任务结果"]
capabilities: |
  flowchart TB
    C["上下文"] --> M["模型与提示"]
    R["检索证据"] --> C
    N["记忆与状态"] --> C
    P["计划和推理"] --> M
    M --> T["受控工具与环境"]
    T --> N
    T --> A["其他 Agent 的交接"]
    A --> N
architecture: |
  flowchart TB
    A["任务合同"] --> B{"控制权如何分配？"}
    B -->|路径已知| C["固定工作流"]
    B -->|依赖即时观察| D["单 Agent 循环"]
    B -->|职责可独立| E["多 Agent 协作"]
    C --> F["状态、权限与交付验收"]
    D --> F
    E --> F
frameworks: |
  flowchart TB
    A["业务应用与模型"] --> B["组件组合"]
    A --> C["图编排和持久化"]
    B --> D["知识库和工具适配"]
    C --> D
    D --> E["MCP 接入能力"]
    C --> F["A2A 交接任务"]
production: |
  flowchart TB
    A["接收并持久化任务"] --> B["队列与 Worker"]
    B --> C["模型、工具和业务服务"]
    C --> D["业务回执与状态提交"]
    B -->|中断或迁移| E["从检查点恢复"]
    E --> B
    D --> F["流式反馈与运行监控"]
quality: |
  flowchart TB
    A["确定任务成功条件"] --> B["标准样本与故障变体"]
    B --> C["检验结果、权限与耗时"]
    C --> D["沿 Trace 找到失败"]
    D --> E["把复现数据加入回归集"]
    E --> B
cases: |
  flowchart TB
    A["业务需求与范围"] --> B["明确证据和可用动作"]
    B --> C["设计架构与执行流程"]
    C --> D["评估交付和异常路径"]
    D -->|未满足| B
    D -->|满足| E["交付并跟踪用户反馈"]
frontier: |
  flowchart TB
    A["提出能力假设"] --> B["确认可用模型与运行机制"]
    B --> C["选择可复查的实验任务"]
    C --> D["与简单基线比较"]
    D -->|稳定有效| E["验证适用范围"]
    D -->|在目标场景不稳定| F["保留研究问题"]
