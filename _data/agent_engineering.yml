- id: foundations
  title: 基础理论与核心概念
  summary: 追踪一次真实形状的执行循环，弄清模型怎样选动作、运行时如何验收，以及任务何时停止。
  slug: agent-engineering-foundations
  topics: [定义与演进, Chatbot 与 Workflow, 感知与反馈, 执行循环, 自主性边界]
  reading: [from-llm-to-agent, function-calling]
- id: capabilities
  title: 核心技术与能力体系
  summary: 拆开模型、工具、知识、记忆、规划、推理、协作和外部环境，理解它们在一次执行中的职责。
  slug: agent-engineering-capabilities
  learning_series:
    title: RAG 深度系列
    url: /series/rag-context/#rag-curriculum
  topics: [LLM 与 Prompt, Tool Use, RAG, Memory, Planning, Reasoning, Multi-Agent, 外部环境交互]
  chapters: [agent-deep-dive-llm-prompt, agent-deep-dive-tool-use, agent-deep-dive-rag, agent-deep-dive-agent-state]
  reading: [rag-basics, hybrid-search, agent-memory, structured-plan-executor]
- id: architecture
  title: 架构设计与设计模式
  summary: 用任务路径、故障代价和状态边界判断何时用工作流、ReAct、规划执行或多 Agent。
  slug: agent-engineering-architecture
  topics: [单 Agent, Workflow, ReAct, Plan-and-Execute, Reflection, Router, Supervisor, 分层与点对点, 人工介入, 状态机]
  chapters: [agent-deep-dive-react, agent-deep-dive-plan-execute, agent-deep-dive-reflection-router, agent-deep-dive-supervisor]
  reading: [agent-planning-patterns, supervisor-manager-agent, why-agent-workflow-needs-state-machine]
- id: frameworks
  title: 开发框架与技术生态
  summary: 从同一条执行链看框架、编排运行时、工具协议与跨 Agent 协议各自接管哪一层。
  slug: agent-engineering-frameworks
  topics: [LangChain, LangGraph, LlamaIndex, AutoGen, CrewAI, Semantic Kernel, MCP, A2A]
  chapters: [agent-deep-dive-langgraph, agent-deep-dive-mcp-a2a]
  reading: [mcp-and-function-calling, mcp-tool-trust-boundary]
- id: production
  title: 工程化与生产实践
  summary: 把演示脚本变成可恢复的服务，逐层讲任务状态、队列、写入回执、部署和成本。
  slug: agent-engineering-production
  topics: [项目结构与依赖, State 与 Session, Checkpoint 与持久化, 异步与队列, 超时与降级, HTTP 与流式响应, 签核与接管, Worker 与调度, 容器与部署, 性能与成本]
  chapters: [agent-deep-dive-durability, agent-deep-dive-deployment]
  reading: [agent-checkpoint-idempotency, retry-rollback-replan, agent-demo-to-system]
- id: quality
  title: 评估、安全与可观测性
  summary: 用固定样本判断改动，沿 Trace 找到偏差，再让权限和审批规则在工具执行前生效。
  slug: agent-engineering-quality
  topics: [任务成功率, 工具及检索评估, Benchmark 与回归, 权限与沙箱, Prompt Injection 防御, 安全审计, Trace 与监控]
  chapters: [agent-deep-dive-evaluation, agent-deep-dive-security-gates, agent-deep-dive-observability]
  reading: [agent-benchmark, deterministic-agent-evaluation, llm-as-judge, agent-tracing, permission-aware-rag, agent-safety-hitl]
- id: cases
  title: 项目实战与案例拆解
  summary: 从客服和资料研究出发，逐步做到分工协作、多租户路由和平台治理。
  slug: agent-engineering-cases
  topics: [智能客服 Agent, Research Agent, Multi-Agent 开发系统, 企业级 Agent 平台]
  chapters: [agent-case-support, agent-case-research, agent-case-development, agent-case-platform]
- id: frontier
  title: 前沿技术与趋势
  summary: 从长任务、跨应用协作和多模态执行出发，拆解哪些变化值得做验证。
  slug: agent-engineering-frontier
  topics: [Agentic Workflow, Deep Research, Coding Agent, Browser 与 Computer Use, 长时任务, MCP 与 A2A, 多模态, 具身智能, 持续学习]
  chapters: [agent-deep-dive-long-running]
  reading: [agent-runtime-overview, coding-agent-harness, agent-replay-reading-notes]
