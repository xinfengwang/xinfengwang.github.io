  <p class="eyebrow">READ WITHOUT A CONNECTION</p><h1>离线文章</h1>
  <p>在文章页点击“离线保存”，可把正文和阅读所需素材保存在当前浏览器。联网时优先打开最新版本，断网时使用保存的副本。</p>
  <p class="muted">保存时间会显示在副本顶部。浏览器清理站点数据或回收存储后，离线副本可能丢失；视频、反馈提交、GitHub 与未保存的外部链接仍需联网。</p>
